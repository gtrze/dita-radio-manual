<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="400" height="300" fill="#fff"/>

  <!-- Telescopic antenna (rear view: mounted on the left) -->
  <g stroke="#000" stroke-linecap="round" fill="none">
    <line x1="75" y1="78" x2="55" y2="48" stroke-width="5"/>
    <line x1="55" y1="48" x2="38" y2="23" stroke-width="3.5"/>
    <line x1="38" y1="23" x2="26" y2="6" stroke-width="2.5"/>
  </g>
  <circle cx="25" cy="5" r="3.5" fill="#000"/>

  <!-- Handle -->
  <path d="M155 78 V52 Q155 36 171 36 H289 Q305 36 305 52 V78" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  <path d="M155 78 V52 Q155 36 171 36 H289 Q305 36 305 52 V78" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

  <!-- Body -->
  <rect x="40" y="70" width="320" height="190" rx="20" fill="#fff" stroke="#000" stroke-width="3"/>
  <rect x="52" y="82" width="296" height="166" rx="12" fill="#fff" stroke="#000" stroke-width="1.5"/>

  <!-- Ventilation slots -->
  <g stroke="#000" stroke-width="3" stroke-linecap="round">
    <line x1="80" y1="100" x2="80" y2="140"/>
    <line x1="92" y1="100" x2="92" y2="140"/>
    <line x1="104" y1="100" x2="104" y2="140"/>
    <line x1="116" y1="100" x2="116" y2="140"/>
    <line x1="128" y1="100" x2="128" y2="140"/>
  </g>

  <!-- Battery compartment cover -->
  <rect x="160" y="150" width="170" height="82" rx="6" fill="#fff" stroke="#000" stroke-width="2.5"/>
  <rect x="236" y="227" width="18" height="10" rx="3" fill="#fff" stroke="#000" stroke-width="2"/>
  <g font-size="9" fill="#000" text-anchor="middle">
    <text x="245" y="178" font-weight="bold">BATTERY</text>
    <text x="245" y="192">4 × AA, 1.5 V</text>
  </g>
  <!-- Polarity hints -->
  <g stroke="#000" stroke-width="1.2" fill="none">
    <rect x="182" y="203" width="40" height="12" rx="2"/>
    <rect x="222" y="206" width="3" height="6" fill="#000"/>
    <rect x="265" y="203" width="40" height="12" rx="2"/>
    <rect x="262" y="206" width="3" height="6" fill="#000"/>
  </g>
  <g font-size="8" fill="#000" font-weight="bold" text-anchor="middle">
    <text x="176" y="212">–</text>
    <text x="231" y="212">+</text>
    <text x="257" y="212">+</text>
    <text x="311" y="212">–</text>
  </g>

  <!-- Mains inlet (IEC C8, figure-8) -->
  <rect x="160" y="96" width="44" height="34" rx="5" fill="#fff" stroke="#000" stroke-width="2"/>
  <path d="M172 104 h20 a8 8 0 0 1 0 18 h-20 a8 8 0 0 1 0 -18 z" fill="#fff" stroke="#000" stroke-width="1.8"/>
  <circle cx="175" cy="113" r="2.3" fill="#000"/>
  <circle cx="189" cy="113" r="2.3" fill="#000"/>
  <text x="182" y="141" font-size="7.5" fill="#000" text-anchor="middle" font-weight="bold">230 V ~ 50 Hz</text>

  <!-- Fuse holder -->
  <circle cx="246" cy="113" r="13" fill="#fff" stroke="#000" stroke-width="2"/>
  <circle cx="246" cy="113" r="8" fill="#fff" stroke="#000" stroke-width="1.2"/>
  <line x1="239" y1="113" x2="253" y2="113" stroke="#000" stroke-width="2.5" stroke-linecap="round"/>
  <text x="246" y="141" font-size="7.5" fill="#000" text-anchor="middle" font-weight="bold">FUSE</text>

  <!-- Feet -->
  <rect x="70" y="258" width="34" height="8" rx="3" fill="#000"/>
  <rect x="296" y="258" width="34" height="8" rx="3" fill="#000"/>
</svg>
