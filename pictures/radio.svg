<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <pattern id="holes" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="2" fill="#000"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="400" height="300" fill="#fff"/>

  <!-- Telescopic antenna -->
  <g stroke="#000" stroke-linecap="round" fill="none">
    <line x1="325" y1="78" x2="345" y2="48" stroke-width="5"/>
    <line x1="345" y1="48" x2="362" y2="23" stroke-width="3.5"/>
    <line x1="362" y1="23" x2="374" y2="6" stroke-width="2.5"/>
  </g>
  <circle cx="375" cy="5" r="3.5" fill="#000"/>

  <!-- Handle -->
  <path d="M95 78 V52 Q95 36 111 36 H229 Q245 36 245 52 V78" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
  <path d="M95 78 V52 Q95 36 111 36 H229 Q245 36 245 52 V78" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

  <!-- Body -->
  <rect x="40" y="70" width="320" height="190" rx="20" fill="#fff" stroke="#000" stroke-width="3"/>
  <rect x="52" y="82" width="296" height="166" rx="12" fill="#fff" stroke="#000" stroke-width="1.5"/>

  <!-- Power switch (ON/OFF), top left -->
  <rect x="64" y="92" width="28" height="11" rx="5.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <circle cx="70" cy="97.5" r="4" fill="#000"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="6.5" font-weight="bold" fill="#000" text-anchor="middle">
    <text x="70" y="113">OFF</text>
    <text x="87" y="113">ON</text>
  </g>

  <!-- Speaker -->
  <circle cx="140" cy="165" r="66" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="140" cy="165" r="58" fill="url(#holes)" stroke="#000" stroke-width="1.5"/>

  <!-- Tuning dial window -->
  <rect x="222" y="98" width="116" height="48" rx="6" fill="#fff" stroke="#000" stroke-width="2"/>
  <g stroke="#000" stroke-width="1">
    <line x1="230" y1="114" x2="330" y2="114"/>
    <line x1="230" y1="114" x2="230" y2="109"/>
    <line x1="250" y1="114" x2="250" y2="109"/>
    <line x1="270" y1="114" x2="270" y2="109"/>
    <line x1="290" y1="114" x2="290" y2="109"/>
    <line x1="310" y1="114" x2="310" y2="109"/>
    <line x1="330" y1="114" x2="330" y2="109"/>
    <line x1="230" y1="132" x2="330" y2="132"/>
    <line x1="230" y1="132" x2="230" y2="127"/>
    <line x1="250" y1="132" x2="250" y2="127"/>
    <line x1="270" y1="132" x2="270" y2="127"/>
    <line x1="290" y1="132" x2="290" y2="127"/>
    <line x1="310" y1="132" x2="310" y2="127"/>
    <line x1="330" y1="132" x2="330" y2="127"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="6.5" fill="#000" text-anchor="middle">
    <text x="230" y="107">88</text>
    <text x="250" y="107">92</text>
    <text x="270" y="107">96</text>
    <text x="290" y="107">100</text>
    <text x="310" y="107">104</text>
    <text x="330" y="107">108</text>
    <text x="230" y="141">53</text>
    <text x="250" y="141">60</text>
    <text x="270" y="141">70</text>
    <text x="290" y="141">90</text>
    <text x="310" y="141">120</text>
    <text x="330" y="141">160</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="6" font-weight="bold" fill="#000">
    <text x="226" y="121">FM</text>
    <text x="226" y="128">AM</text>
  </g>
  <line x1="283" y1="101" x2="283" y2="143" stroke="#000" stroke-width="2.5"/>

  <!-- Knobs -->
  <circle cx="250" cy="190" r="22" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="250" cy="190" r="16" fill="none" stroke="#000" stroke-width="1"/>
  <line x1="250" y1="190" x2="250" y2="172" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <circle cx="312" cy="190" r="22" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="312" cy="190" r="16" fill="none" stroke="#000" stroke-width="1"/>
  <line x1="312" y1="190" x2="325" y2="177" stroke="#000" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="7" fill="#000" text-anchor="middle">
    <text x="250" y="224">VOLUME</text>
    <text x="312" y="224">TUNING</text>
  </g>

  <!-- Band switch -->
  <rect x="266" y="231" width="30" height="11" rx="5.5" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <circle cx="290" cy="236.5" r="4" fill="#000"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="6.5" font-weight="bold" fill="#000" text-anchor="middle">
    <text x="257" y="239">AM</text>
    <text x="306" y="239">FM</text>
  </g>

  <!-- Feet -->
  <rect x="70" y="258" width="34" height="8" rx="3" fill="#000"/>
  <rect x="296" y="258" width="34" height="8" rx="3" fill="#000"/>
</svg>
